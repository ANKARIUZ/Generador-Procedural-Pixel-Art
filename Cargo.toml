[package]
name = "procedural_city_engine"
version = "0.1.0"
edition = "2021"

[features]
default = []
diagnostics = []

[dependencies]
winit = "0.30"
wgpu = "24.0"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1.19", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
png = "0.17"
thiserror = "2.0"
